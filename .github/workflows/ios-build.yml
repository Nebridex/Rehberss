name: iOS Compile Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ContactCleaner/**'
      - 'ContactCleanerTests/**'
      - 'ContactCleaner.xcodeproj/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ContactCleaner.xcodeproj \
            -target ContactCleaner \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build | xcpretty
      - name: Compile test target for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ContactCleaner.xcodeproj \
            -target ContactCleanerTests \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build | xcpretty
